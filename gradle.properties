# Force Gradle daemon to use the toolchain JDK (Java 21) rather than the system JDK
# This ensures the build works even when the system has Java 22+
# Set to your JDK 21 path if building on a machine with Java 22+ as default
# org.gradle.java.home=C:/Users/blackowlzz/.gradle/jdks/eclipse_adoptium-21-amd64-windows.2
# Increase Gradle daemon heap (optional, speeds up large builds)
org.gradle.jvmargs=-Xmx2g -Dfile.encoding=UTF-8
